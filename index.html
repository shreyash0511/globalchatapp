
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCREVIVAL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: powderblue;">

    <img src="https://prestigeclient.vip/assets/img/logo.png"
         style="width: 200px;" id="img">

    <h1 id="title">GCREVIVAL by King Shreyash</h1>
    <div id="titleshadow"></div>

    <label for="user">Username</label>
    <input type="text" id="user" name="user"
           placeholder="Enter your username">

    <h1></h1>

    <label for="message">Message</label>
    <input type="text" id="message" name="message"
           placeholder="Write your message">

    <h1></h1>

    <button id="sendButton">Enter</button>

    <div id="chatMessages">
        <h2 id="chez">Stream</h2>
    </div>

    
<script src="/socket.io/socket.io.js"></script>
<script>
    const username = document.getElementById("user");
    const message = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const chatMessages = document.getElementById("chatMessages");

    const socket = io();
    const storageKey = "gcrevivalMessages";

    let messages = JSON.parse(
        localStorage.getItem(storageKey) || "[]"
    );

    function displayMessages() {
        messages.forEach(function(item) {
            const newMessage = document.createElement("p");
            newMessage.textContent =
                item.username + ": " + item.message;
            chatMessages.appendChild(newMessage);
        });
    }

    socket.on("chat message", function(data) {
        messages.push(data);

        localStorage.setItem(
            storageKey,
            JSON.stringify(messages)
        );

        // Refresh the page after receiving a message
        window.location.reload();
    });

    function sendMessage() {
        const userText = username.value.trim();
        const messageText = message.value.trim();

        if (!userText || !messageText) {
            return;
        }

        if (!socket.connected) {
            alert("Not connected to the chat server!");
            return;
        }

        socket.emit("chat message", {
            username: userText,
            message: messageText
        });

        message.value = "";
    }

    sendButton.addEventListener("click", sendMessage);

    message.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    displayMessages();
</script>


</body>
</html>
